[project]
name = "scriptora"
version = "0.1.0"
description = "Context-aware, voice-controlled AI subtitle agent powered by AssemblyAI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Real-time Speech-to-Text + the LLM Gateway (same API key for both)
    "assemblyai>=1.6,<2",
    # ASGI server, WebSocket transport, static files, Jinja templates
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    # Config + typed structured-output validation
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
scriptora = "scriptora.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
    # `class Foo(str, Enum)` is deliberate. These enums cross the wire as
    # Pydantic-serialised JSON that the browser switches on, and `StrEnum`
    # would change `str(member)` from "CommandKind.CORRECT_LAST" to
    # "correct_last" - a silent behaviour change in log and UI strings.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
